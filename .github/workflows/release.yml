name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (for example v2.0.0). The job checks out that tag; this workflow file comes from the branch you run it on (main)."
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the version tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "Refusing to build unexpected ref: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install compile SDK 37.1
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Decode the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/salute-sync.jks"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/salute-sync.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name the APK and take the English notes
        run: |
          version="${{ steps.tag.outputs.version }}"
          cp app/build/outputs/apk/release/salute-sync-release.apk "salute-sync-${version}.apk"
          python3 scripts/extract-release-notes.py "$version" RELEASE_NOTES.md release-notes-en.md

      - name: Upload the signed APK
        uses: actions/upload-artifact@v7
        with:
          name: salute-sync-${{ steps.tag.outputs.version }}
          path: salute-sync-${{ steps.tag.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG already exists; leaving it unchanged (no delete, no overwrite). The signed APK is on this run as a workflow artifact."
            exit 0
          fi
          gh release create "$TAG" \
            --title "Salute Sync ${VERSION}" \
            --notes-file release-notes-en.md \
            "salute-sync-${VERSION}.apk"
